[package]
name = "graphrun-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Graphrun verification driver and fixture processes"

[[bin]]
name = "graphrun-e2e"
path = "src/main.rs"

[features]
