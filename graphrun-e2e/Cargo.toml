[package]
name = "graphrun-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Graphrun verification driver and fixture processes"

[[bin]]
name = "graphrun-e2e"
path = "src/main.rs"

[[bin]]
name = "graphrun-format-proof"
path = "src/bin/format_proof.rs"
required-features = ["format-proof-new"]

[[bin]]
name = "graphrun-format-rollout"
path = "src/bin/format_rollout.rs"

[features]
default = []
fault-injection = ["graphrun/fault-injection"]
format-proof = ["graphrun/format-proof"]
format-proof-new = ["format-proof", "graphrun/format-proof-new"]

[dependencies]
clap.workspace = true
graphrun = { workspace = true, features = ["fixture-worker"] }
hex.workspace = true
prost.workspace = true
redb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
tonic.workspace = true
