dsl: graphrun/v1
id: parallel_quotes
version: 1
input_schema: order/v1
output_schema: {tuple: [tax/v1, shipping/v1]}
start: quotes
nodes:
  quotes:
    kind: parallel
    branches:
      - name: tax
        input: {from: workflow.input}
        body:
          input_schema: order/v1
          output_schema: tax/v1
          start: quote
          nodes:
            quote:
              kind: activity
              activity: {name: tax.quote, version: 1}
              input: {from: scope.input}
              next: done
            done:
              kind: complete
              output: {from: nodes.quote.output}
      - name: shipping
        input: {from: workflow.input}
        body:
          input_schema: order/v1
          output_schema: shipping/v1
          start: quote
          nodes:
            quote:
              kind: activity
              activity: {name: shipping.quote, version: 1}
              input: {from: scope.input}
              next: done
            done:
              kind: complete
              output: {from: nodes.quote.output}
    next: finish
  finish:
    kind: complete
    output: {from: nodes.quotes.output}
