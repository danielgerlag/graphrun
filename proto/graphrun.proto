syntax = "proto3";
package graphrun.v1;

message Blob {
  bytes json = 1;
  uint64 sender_id = 2;
}

service Raft {
  rpc AppendEntries(Blob) returns (Blob);
  rpc Vote(Blob) returns (Blob);
  rpc InstallSnapshot(Blob) returns (Blob);
  rpc ClockHealth(ClockHealthRequest) returns (ClockHealthResponse);
}

message ClockHealthRequest {
  uint64 sender_id = 1;
}

message ClockHealthResponse {
  uint64 member_id = 1;
  uint64 wall_ms = 2;
}

message Ack {
  string error = 1;
}

message StartRequest {
  string command_id = 1;
  string yaml = 2;
  bytes catalog_json = 3;
  bytes input_json = 4;
  // Published start: workflow name, 0 means latest; yaml/catalog_json must be empty.
  string workflow = 5;
  uint32 version = 6;
  string start_key = 7;
}

message StartResponse {
  string run_id = 1;
  string error = 2;
  bytes command_result_json = 3;
}

message PublishCatalogRequest {
  string command_id = 1;
  uint32 version = 2;
  bytes catalog_json = 3;
}

message PublishDefinitionRequest {
  string command_id = 1;
  uint32 catalog_version = 2;
  string yaml = 3;
}

message CommandResultRequest {
  string command_id = 1;
}

message CommandResultResponse {
  bytes result_json = 1;
}

message SignalRequest {
  string command_id = 1;
  string run_id = 2;
  string event_id = 3;
  string name = 4;
  string key = 5;
  bytes payload_json = 6;
}

message CancelRequest {
  string command_id = 1;
  string run_id = 2;
  string reason = 3;
}

message InspectRequest {
  string run_id = 1;
}

message InspectResponse {
  bytes view_json = 1;
  string error = 2;
}

message ListRequest {}

message ListResponse {
  bytes runs_json = 1;
}

message HistoryRequest {
  string run_id = 1;
  // Exclusive per-run sequence cursor; zero begins at the retained floor.
  uint64 after_sequence = 2;
  // Zero selects the default of 100; maximum 1000.
  uint32 page_size = 3;
}

message HistoryResponse {
  // JSON HistoryPage, including retained_from, retained_through and next_cursor.
  bytes events_json = 1;
  string error = 2;
}

message ReplayRequest {
  string run_id = 1;
  // Inclusive per-run sequence, required and nonzero.
  uint64 through_sequence = 2;
}

message ReplayResponse {
  bytes view_json = 1;
  string error = 2;
}

message ClockAcknowledgeRequest {
  string reason = 1;
}

service Client {
  rpc PublishCatalog(PublishCatalogRequest) returns (CommandResultResponse);
  rpc PublishDefinition(PublishDefinitionRequest) returns (CommandResultResponse);
  rpc GetCommandResult(CommandResultRequest) returns (CommandResultResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Signal(SignalRequest) returns (Ack);
  rpc Cancel(CancelRequest) returns (Ack);
  rpc Inspect(InspectRequest) returns (InspectResponse);
  rpc List(ListRequest) returns (ListResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Replay(ReplayRequest) returns (ReplayResponse);
  rpc AcknowledgeClock(ClockAcknowledgeRequest) returns (Ack);
}

message RegisterRequest {
  string session_id = 1;
  reserved 2;
  uint32 capacity = 3;
  repeated WorkerCapability capabilities = 4;
  string principal_id = 5;
  uint32 protocol_min = 6;
  uint32 protocol_max = 7;
  string command_id = 8;
}

message RegisterResponse {
  string error = 1;
  uint64 revision = 2;
  uint64 lease_expiry_ms = 3;
}

message WorkerCapability {
  string activity_name = 1;
  uint32 activity_version = 2;
  string role = 3;
  uint32 codec_version = 4;
  string input_schema_digest = 5;
  string output_schema_digest = 6;
  string contract_digest = 7;
}

message RenewSessionRequest {
  string command_id = 1;
  string session_id = 2;
  uint64 revision = 3;
}

message RenewSessionResponse {
  uint64 revision = 1;
  uint64 lease_expiry_ms = 2;
}

message WatchReadyRequest {
  string session_id = 1;
  uint64 generation = 2;
  uint64 cursor = 3;
}

message WatchReadyResponse {
  uint64 generation = 1;
  uint64 cursor = 2;
  bool ready = 3;
  bool resync = 4;
}

message ClaimRequest {
  string command_id = 1;
  string session_id = 2;
  uint32 capacity = 3;
}

message Assignment {
  string run_id = 1;
  string activation_id = 2;
  string activity_name = 3;
  uint32 activity_version = 4;
  bytes input_json = 5;
  string role = 6;
  string effect_key = 7;
  uint64 generation = 8;
  uint64 revision = 9;
  uint64 lease_expiry_ms = 10;
  uint64 attempt_deadline_ms = 11;
  string session_id = 12;
  uint32 codec_version = 13;
  string input_schema_digest = 14;
  string output_schema_digest = 15;
  string contract_digest = 16;
  uint32 attempt = 17;
  string scope_id = 18;
}

message ClaimResponse {
  repeated Assignment assignments = 1;
  string error = 2;
}

message RenewRequest {
  string command_id = 1;
  string session_id = 2;
  string activation_id = 3;
  uint64 generation = 4;
  uint64 revision = 5;
}

message RenewResponse {
  uint64 revision = 1;
  uint64 lease_expiry_ms = 2;
  string error = 3;
}

message ReportRequest {
  string command_id = 1;
  string session_id = 2;
  string run_id = 3;
  string activation_id = 4;
  uint64 generation = 5;
  uint64 revision = 6;
  bytes output_json = 7;
  string error_code = 8;
  string error_message = 9;
  string output_schema_digest = 10;
}

message ReconcileRequest {
  string command_id = 1;
  string session_id = 2;
  string run_id = 3;
  string activation_id = 4;
  string outcome = 5;
  bytes output_json = 6;
  uint64 generation = 7;
  uint64 revision = 8;
  string output_schema_digest = 9;
  string error_code = 10;
  string error_message = 11;
}

service Worker {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RenewSession(RenewSessionRequest) returns (RenewSessionResponse);
  rpc WatchReady(WatchReadyRequest) returns (WatchReadyResponse);
  rpc Claim(ClaimRequest) returns (ClaimResponse);
  rpc Renew(RenewRequest) returns (RenewResponse);
  rpc Report(ReportRequest) returns (Ack);
  rpc Reconcile(ReconcileRequest) returns (Ack);
}
