name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: spec traceability
        run: python3 docs/specs/v1/check-specs.py
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace --locked
      - name: doc tests
        run: cargo test --workspace --doc --locked
      - name: crash cuts
        run: cargo test -p graphrun --test crash_cut --features fault-injection --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: crates.io dry-run
        run: bash scripts/publish.sh --dry-run

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: test 1.90.0
        run: cargo +1.90.0 test --workspace --locked

  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release CLI
        run: cargo build --release --locked -p graphrun-cli
      - name: cluster smoke with independent worker processes
        run: >
          cargo run --locked -p graphrun-e2e -- smoke-cluster
          --cli target/release/graphrun
          --artifacts /tmp/gr-smoke
      - name: e2e matrix
        run: >
          cargo run --locked -p graphrun-e2e -- verify
          --cli target/release/graphrun
          --matrix docs/specs/v1/verification-matrix.tsv
          --artifacts /tmp/gr-e2e
      - name: upload e2e artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.os }}
          path: |
            /tmp/gr-e2e/
            /tmp/gr-smoke/
          if-no-files-found: warn
