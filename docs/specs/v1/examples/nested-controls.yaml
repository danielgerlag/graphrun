dsl: graphrun/v1
id: nested_controls
version: 1
input_schema: {array: counter/v1}
output_schema:
  array:
    tuple: [counter/v1, counter/v1]
start: items
nodes:
  items:
    kind: foreach
    items: {from: workflow.input}
    item_schema: counter/v1
    max_items: 10
    max_concurrency: 3
    body:
      input_schema: counter/v1
      output_schema: {tuple: [counter/v1, counter/v1]}
      start: repeat
      nodes:
        repeat:
          kind: repeat
          count: {literal: 2}
          state_schema: counter/v1
          state: {from: scope.input}
          max_iterations: 10
          body:
            input_schema: counter/v1
            output_schema: counter/v1
            start: increment
            nodes:
              increment:
                kind: activity
                activity: {name: counter.increment, version: 1}
                input: {from: scope.input}
                next: done
              done:
                kind: complete
                output: {from: nodes.increment.output}
          next: branches
        branches:
          kind: parallel
          branches:
            - name: local
              input: {from: nodes.repeat.output}
              body:
                input_schema: counter/v1
                output_schema: counter/v1
                start: increment
                nodes:
                  increment:
                    kind: activity
                    activity: {name: counter.increment, version: 1}
                    input: {from: scope.input}
                    next: done
                  done:
                    kind: complete
                    output: {from: nodes.increment.output}
            - name: remote
              input: {from: nodes.repeat.output}
              body:
                input_schema: counter/v1
                output_schema: counter/v1
                start: echo
                nodes:
                  echo:
                    kind: activity
                    activity: {name: remote.echo, version: 1}
                    input: {from: scope.input}
                    next: done
                  done:
                    kind: complete
                    output: {from: nodes.echo.output}
          next: done
        done:
          kind: complete
          output: {from: nodes.branches.output}
    next: finish
  finish:
    kind: complete
    output: {from: nodes.items.output}
